[package]
name = "catalog-importer"
version = "0.1.0"
description = "Standalone catalog-song importer for Nightingale 1.0.0+."
authors = ["rzru <rzzzzru@gmail.com>"]
license = "GPL-3.0"
edition = "2021"

[lib]
name = "importer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Shared domain logic.
app-core = { path = "../../app-core" }

# Tauri 2 core + the plugins we actually use.
# `custom-protocol` is REQUIRED for release builds: without it the webview
# tries to load `devUrl` (http://localhost:1421/) at runtime, finds nothing
# listening, and surfaces ERR_CONNECTION_REFUSED as "Vaya… no se puede
# acceder a esta página". Enabling the feature swaps in the asset-protocol
# handler so `frontendDist/../dist` is served from the binary itself.
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Std / utility.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
thiserror = "1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dotenvy = "0.15.7"

# HTTP for downloading the catalog zip + cover art. `native-tls` mirrors
# the main app's choice so the importer survives Avast-MITM proxies on
# Windows hosts (see rust-tls-avast-windows.md in the project memory).
ureq = { version = "3", default-features = false, features = ["json", "native-tls"] }

[lints]
workspace = true
